<!DOCTYPE html>
<html lang="">
<head>
<meta charset="utf-8">  
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Piano</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
<header class="header">  
<h1>Interactive Piano</h1>
<p class="muted">Play notes using your mouse or computer keyboard.</p>
</header>
<section class="controls">
<button id="theme-toggle" type="button">Toggle Theme</button>
<div class="status">
<span class="muted">Active Note:</span>  
<span id="active-note">None</span>
</div>
</section>
<section class="piano-wrapper">
<div id="keyboard" class="keyboard"></div>
</section>
</main>  
<script src="script.js"></script>
</body>
</html>
